openapi: 3.0.3
info:
  title: Task Health API
  version: 1.0.0
  description: Small in-memory REST API for portfolio and learning.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Check service health
      responses:
        '200':
          description: Service is available
  /tasks:
    get:
      summary: List tasks
      responses:
        '200':
          description: Task collection
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created
        '422':
          description: Invalid input
  /tasks/{id}:
    get:
      summary: Get one task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task found
        '404':
          description: Task not found
    patch:
      summary: Update a task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Task updated
        '422':
          description: Invalid input
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
    TaskPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        completed:
          type: boolean

